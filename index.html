<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Scratch - Top 10 Juegos</title>
  <!-- Fuentes amigables y redondeadas de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --scratch-orange: #ffab19;
      --scratch-blue: #4d97ff;
      --turbo-pink: #ff4c4c;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* Fondo decorativo con figuras geométricas flotantes */
    .bg-shapes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      animation: float 12s infinite ease-in-out;
    }

    .shape:nth-child(1) { width: 220px; height: 220px; top: -40px; left: -40px; }
    .shape:nth-child(2) { width: 300px; height: 300px; bottom: 10%; right: -80px; animation-delay: -4s; }
    .shape:nth-child(3) { width: 140px; height: 140px; top: 45%; left: 10%; animation-delay: -7s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(10deg); }
    }

    /* Encabezado */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 45px 20px 25px;
      color: #fff;
    }

    .badge-top {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      text-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      margin-bottom: 10px;
    }

    header p {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      max-width: 620px;
      margin: 0 auto;
      opacity: 0.95;
      font-weight: 700;
    }

    /* Barra de filtros */
    .filters {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 20px 30px;
    }

    .filter-btn {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: #ffab19;
      color: #1e293b;
      box-shadow: 0 4px 0 #d97706;
    }

    /* Contenedor principal de tarjetas */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Tarjeta de juego */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18), 0 6px 0 rgba(0, 0, 0, 0.08);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.24), 0 8px 0 rgba(0, 0, 0, 0.1);
    }

    /* Número de Ranking */
    .rank-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f5f9;
      color: #475569;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .card[data-rank="1"] .rank-badge { background: #fef08a; color: #854d0e; }
    .card[data-rank="2"] .rank-badge { background: #e2e8f0; color: #334155; }
    .card[data-rank="3"] .rank-badge { background: #fed7aa; color: #9a3412; }

    /* Contenedor del ícono distintivo */
    .icon-box {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.15);
    }

    .icon-box svg {
      width: 52px;
      height: 52px;
    }

    .tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      width: fit-content;
    }

    .card h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .author {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .desc {
      font-size: 0.95rem;
      line-height: 1.45;
      color: #475569;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    /* Botones de acción */
    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-play {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 5px 0 #15803d;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-play:hover {
      background: #16a34a;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #15803d;
    }

    .btn-play:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #15803d;
    }

    .btn-turbo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f43f5e;
      color: #fff;
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 12px;
      border-radius: var(--radius-md);
      box-shadow: 0 5px 0 #be123c;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      title: "Jugar rápido en TurboWarp";
    }

    .btn-turbo:hover {
      background: #e11d48;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #be123c;
    }

    .btn-turbo:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #be123c;
    }

    /* Pie de página */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 50px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    footer span {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
    }
  </style>
</head>

    const grid = document.getElementById("games-grid");
    const filterButtons = document.querySelectorAll(".filter-btn");

    function renderGames(filter = "all") {
      grid.innerHTML = "";
      const filtered = filter === "all" 
        ? games 
        : games.filter(g => g.category === filter);

      filtered.forEach(game => {
        const card = document.createElement("article");
        card.className = "card";
        card.setAttribute("data-rank", game.rank);

        card.innerHTML = `
          <span class="rank-badge">#${game.rank}</span>
          <div>
            <div class="icon-box" style="background: ${game.iconBg};">
              ${game.svg}
            </div>
            <span class="tag" style="background: ${game.tagBg}; color: ${game.tagColor};">
              ${game.tagText}
            </span>
            <h2>${game.title}</h2>
            <p class="author">Por @${game.author}</p>
            <p class="desc">${game.desc}</p>
          </div>
          <div class="actions">
            <a class="btn-play" href="https://scratch.mit.edu/projects/${game.id}/" target="_blank" rel="noopener noreferrer">
              ▶ Jugar
            </a>
            <a class="btn-turbo" href="https://turbowarp.org/${game.id}" target="_blank" rel="noopener noreferrer" title="Abrir en TurboWarp (60 FPS)">
              ⚡ Turbo
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderGames(btn.dataset.filter);
      });
    });

    // Render inicial
    renderGames();
  </script>
</body>
